name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - mobile

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-arm64

      - name: Build release binary for iOS (arm64)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --target aarch64-apple-ios --bin rustudio

      - name: Bundle RtRustMobile.app & create unsigned IPA
        run: |
          rm -rf Payload RtRustMobile-unsigned.ipa
          mkdir -p Payload/RtRustMobile.app
          cp target/aarch64-apple-ios/release/rustudio Payload/RtRustMobile.app/RtRustMobile
          chmod +x Payload/RtRustMobile.app/RtRustMobile
          if [ -d assets ]; then
            cp -R assets Payload/RtRustMobile.app/assets
          fi
          if [ -d ios/icons ]; then
            cp ios/icons/AppIcon*.png Payload/RtRustMobile.app/
          fi
          cat > LaunchScreen.storyboard <<'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="22505" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="dark"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="22504"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" red="0.078" green="0.090" blue="0.125" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          STORYBOARD
          ibtool --compile Payload/RtRustMobile.app/LaunchScreen.storyboardc LaunchScreen.storyboard
          rm -f LaunchScreen.storyboard
          cat > Payload/RtRustMobile.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>RtRustMobile</string>
            <key>CFBundleExecutable</key>
            <string>RtRustMobile</string>
            <key>CFBundleIdentifier</key>
            <string>com.rtrust.mobile</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>RtRustMobile</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.5.1</string>
            <key>CFBundleVersion</key>
            <string>6</string>
            <key>LSSupportsGameMode</key>
            <true/>
            <key>GCSupportsGameMode</key>
            <true/>
            <key>DTPlatformName</key>
            <string>iphoneos</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiresFullScreen</key>
            <true/>
            <key>UIStatusBarHidden</key>
            <true/>
            <key>UIViewControllerBasedStatusBarAppearance</key>
            <false/>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
                <key>UIPrerenderedIcon</key>
                <true/>
              </dict>
            </dict>
            <key>CFBundleIcons~ipad</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                  <string>AppIcon76x76</string>
                </array>
                <key>UIPrerenderedIcon</key>
                <true/>
              </dict>
            </dict>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST
          zip -r -q RtRustMobile-unsigned.ipa Payload
          ls -lh RtRustMobile-unsigned.ipa

      - name: Upload RtRustMobile-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: RtRustMobile-unsigned-ipa
          path: RtRustMobile-unsigned.ipa
